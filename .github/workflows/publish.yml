name: publish

# Publish both packages when a version tag is pushed: `git tag v0.6.0 && git push --tags`.
# Requires two repository secrets:
#   NPM_TOKEN        — an npm automation token (npm/llmrouter package)
#   PYPI_API_TOKEN   — a PyPI API token for the `llmrouter` project
# The full test + parity suite runs as the gate; a failure blocks publishing.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-pypi:
    runs-on: ubuntu-latest
    needs: test
    environment: release
    permissions:
      id-token: write  # PyPI trusted publishing (no token needed if configured)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel --sdist
        working-directory: llmrouter
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: llmrouter/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-npm:
    runs-on: ubuntu-latest
    needs: test
    environment: release
    defaults:
      run:
        working-directory: npm/llmrouter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
